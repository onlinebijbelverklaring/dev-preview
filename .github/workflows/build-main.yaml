name: Build and Deploy Zensical to GitHub Pages

on:
  push:
    branches:
      - main

# Vereiste permissies voor het bouwen en deployen naar GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zorg ervoor dat er maar één concurrent deployment tegelijk draait
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Zensical site
        run: npx zensical build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs # Pas aan naar de output map van Zensical als deze afwijkt (bijv. ./build of ./public)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4